# Voorbeeldconfiguratie voor nginx (Linux-server).
#
# Vervang overal "muziek.jouwdomein.nl" door je eigen (sub)domein en zet de
# bestanden van de Retrospeler in /var/www/retrospeler.
#
# Plaatsen:   sudo cp nginx-retrospeler.conf /etc/nginx/sites-available/retrospeler
#             sudo ln -s /etc/nginx/sites-available/retrospeler /etc/nginx/sites-enabled/
# HTTPS:      sudo certbot --nginx -d muziek.jouwdomein.nl
#             (certbot vult de certificaatregels hieronder zelf in)
# Herladen:   sudo nginx -t && sudo systemctl reload nginx

# Gewoon http:// doorsturen naar https://
server {
    listen 80;
    server_name muziek.jouwdomein.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name muziek.jouwdomein.nl;

    # Deze twee regels zet certbot er zelf neer:
    # ssl_certificate     /etc/letsencrypt/live/muziek.jouwdomein.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/muziek.jouwdomein.nl/privkey.pem;

    root /var/www/retrospeler;
    index index.html;

    # De pagina mag de microfoon en het scherm/tabblad delen gebruiken (alleen voor zichzelf).
    add_header Permissions-Policy "microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Interne bestanden niet online tonen.
    location ~ ^/(deploy/|start\.bat|README\.md) {
        return 404;
    }
}
